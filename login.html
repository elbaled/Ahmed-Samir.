<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <title>Ahmed Samir | Admin Login</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

    <main class="login-page">

        <div class="login-background"></div>

        <section class="login-card">

            <div class="brand">

                <div class="brand-logo">
                    AS
                </div>

                <div class="brand-text">
                    <h1>Ahmed Samir</h1>
                    <p>Portfolio Admin</p>
                </div>

            </div>


            <div class="login-heading">

                <h2>Welcome Back</h2>

                <p>
                    Sign in to manage your portfolio.
                </p>

            </div>


            <form
                id="loginForm"
                class="login-form"
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span id="loginButtonText">
                        Sign In
                    </span>

                    <span
                        id="loginLoader"
                        class="loader hidden"
                    ></span>

                </button>

            </form>


            <a
                href="https://elbaled.github.io/AHMED-SAMIR-/"
                class="back-to-site"
            >
                ← Back to Portfolio
            </a>

        </section>

    </main>


    <script
        type="module"
        src="login.js"
    ></script>

</body>

</html>

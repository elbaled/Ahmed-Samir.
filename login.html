<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Ahmed Samir</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="logo">
                AS
            </div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Ahmed Samir Portfolio
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="message"
                ></p>

            </form>


            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Website
            </a>

        </section>

    </main>


    <script
        type="module"
        src="login.js"
    ></script>

</body>
</html>
